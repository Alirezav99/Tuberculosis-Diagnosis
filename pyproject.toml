[project]
name = "afb-segmentation"
version = "0.1.0"
description = ""
authors = [
    {name = "Alireza Vahdani",email="reza.vhdni99@gmail.com"}
]
readme = "README.md"
requires-python = ">3.12"
dependencies = [
    "numpy (>=2.3.1,<3.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "ultralytics (>=8.3.162,<9.0.0)",
    "dask (>=2025.7.0,<2026.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "torchmetrics (>=1.8.2,<2.0.0)",
    "distributed (>=2025.11.0,<2026.0.0)",
    "optuna (>=4.6.0,<5.0.0)"
]
[tool.poetry]
packages = [{include = "afb_segmentation", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
